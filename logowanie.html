
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logowanie - Vulcan++</title>
    <link rel="stylesheet" href="wyglad.css">
</head>
<body>

<header>
    <div class="container">
        <h1>Dziennik Vulcan++</h1>
        <nav>
            <a href="index.php">Strona główna</a>
            <a href="rejestracja.html">Rejestracja</a>
        </nav>
    </div>
</header>

<main>
    <section class="intro">
        <h2>Witaj w Dzienniku Vulcan++</h2>
        <p>Zaloguj się, aby zobaczyć plan lekcji.</p>
    </section>

    <div class="forms">
        <section id="logowanie">
            <form id="login-form">
                <fieldset>
                    <legend>Logowanie</legend>

                    <label for="login-email">Adres e-mail</label>
                    <input
                        id="login-email"
                        name="email"
                        type="email"
                        autocomplete="email"
                        required
                    >

                    <label for="login-password">Hasło</label>
                    <input
                        id="login-password"
                        name="password"
                        type="password"
                        autocomplete="current-password"
                        required
                    >

                    <button type="submit">Zaloguj</button>

                    <p class="message" aria-live="polite"></p>
                </fieldset>
            </form>
        </section>
    </div>
</main>

<footer>
    <div class="dolny">
        <p>Szymon Katana, Maciej Leszczyński 3P</p>
    </div>
</footer>

<script>
document.getElementById("login-form").addEventListener("submit", async (event) => {
    event.preventDefault();

    const form = event.target;
    const message = form.querySelector(".message");

    const email = form.elements.email.value;
    const password = form.elements.password.value;

    message.textContent = "Sprawdzanie danych...";

    try {
        const response = await fetch("login.php", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                email: email,
                password: password
            })
        });

        const data = await response.json();

        if (response.ok && data.success) {
           window.location.replace("index.php");
            return;
        }

        message.textContent =
            data.message || "Błędne dane logowania.";

    } catch (error) {
        message.textContent = "Nie można połączyć się z serwerem.";
    }
});
</script>

</body>
</html>
